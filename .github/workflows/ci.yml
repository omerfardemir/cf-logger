name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the Publish workflow, so a release only ships a commit that passed CI.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The dev Workers and the agent skill snippets import the built package.
      - run: pnpm typecheck:dev
      - run: pnpm check:skill
      - run: pnpm pack:dry

  e2e:
    name: Local Workers e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm e2e:local
        env:
          LOGGERCF_E2E_LOG_DIR: ${{ runner.temp }}

      - name: Upload wrangler logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-wrangler-logs
          path: ${{ runner.temp }}/loggercf-e2e.*.log
          if-no-files-found: ignore
