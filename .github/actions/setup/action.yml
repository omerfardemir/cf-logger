name: Setup
description: Install pnpm (version from package.json "packageManager"), Node.js, and dependencies.

inputs:
  registry-url:
    description: npm registry to write into .npmrc (only needed for publishing).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
